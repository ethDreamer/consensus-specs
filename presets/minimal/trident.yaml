# 2**6 (= 64)
MAX_GOLDFISH_AGGREGATES: 64
# 2**7 (= 128)
MAX_STABILIZATION_AGGREGATES: 128
# 2**7 (= 128)
MAX_FINALITY_AGGREGATES: 128
# 2**4 (= 16)
MAX_TRIDENT_SLASHINGS: 16
